- alias: ECM on at 0615 on weekdays
  initial_state: True
  trigger:
    - platform: time
      at: "06:15:00"
  condition:
    - condition: state
      entity_id: group.camsandy
      state: "home"
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
  action:
    entity_id: switch.ecm
    service: switch.turn_on

- alias: ECM on at 615 on weekend
  initial_state: True
  trigger:
    - platform: time
      at: "06:15:00"
  condition:
    - condition: state
      entity_id: group.camsandy
      state: "home"
    - condition: time
      weekday:
        - sat
        - sun
  action:
    entity_id: switch.ecm
    service: switch.turn_on

- alias: ECM on one off
  initial_state: False
  trigger:
    - platform: time
      at: "06:00:00"
  condition:
    - condition: state
      entity_id: group.camsandy
      state: "home"
  action:
    entity_id: switch.ecm
    service: switch.turn_on
